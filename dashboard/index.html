<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>EuroArgo Dashboard</title>
  <link rel="stylesheet" href="Dashboard.css">
</head>

<body>

<h1>EuroArgo Dashboard</h1>

<div id="summary"></div>

<div class="controls">
  <input type="text" id="search" placeholder="Search repository...">
  
  <select id="sort">
    <option value="default">Sort by</option>
    <option value="best">Best</option>
    <option value="worst">Worst</option>
    <option value="name">Name</option>
  </select>
</div>

<div id="stats"></div>

<table id="dashboard">
  <thead>
    <tr>
      <th>Repository</th>
      <th>Novice</th>
      <th>Beginner</th>
      <th>Intermediate</th>
      <th>Advanced</th>
      <th>Expert</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div id="popup" class="hidden">
  <div class="popup-content">
    <span id="close">&times;</span>
    <h2 id="popup-title"></h2>
    <ul id="popup-list"></ul>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
